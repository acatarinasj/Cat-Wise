<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CatWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
:root{
  --terra:#C97B5A;--brown:#A8845C;
  --teal:#2E6B63;--mint:#4DB8A4;
  --bg:#eef2f0;--surface:#FDFAF5;--surface2:#e4eeea;
  --text:#1e3530;--text2:#4a7068;--border:#c5d4d0;
  --red:#B94A2C;--radius:14px;--shadow:0 2px 16px rgba(46,107,99,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg);}
.auth-logo{height:120px;width:auto;margin-bottom:8px;border-radius:12px;}
.auth-title{font-size:22px;font-weight:800;color:var(--teal);margin-bottom:4px;}
.auth-sub{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:32px;}
.auth-card{background:var(--surface);border-radius:20px;padding:24px 20px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(46,107,99,0.13);border:1px solid var(--border);}
.auth-card-title{font-size:16px;font-weight:800;color:var(--teal);margin-bottom:18px;text-align:center;}
.auth-form-group{margin-bottom:14px;}
.auth-form-group label{display:block;font-size:9px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;}
.auth-form-group input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;padding:10px 12px;font-family:'Nunito',sans-serif;font-weight:600;transition:border-color 0.2s;}
.auth-form-group input:focus{outline:none;border-color:var(--mint);}
.auth-error{font-size:11px;color:var(--red);font-weight:700;margin-bottom:10px;text-align:center;min-height:16px;}
.btn-auth{width:100%;padding:13px;background:linear-gradient(135deg,#C4858A,#A8636A);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:4px;font-family:'Nunito',sans-serif;box-shadow:0 4px 14px rgba(168,99,106,0.35);transition:opacity 0.2s;}
.btn-auth:hover{opacity:0.9;}
.btn-auth:disabled{opacity:0.6;cursor:not-allowed;}
.app-screen{display:none;}
.app-screen.visible{display:block;}
.header{background:#F0EAE0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(168,132,92,0.18);}
.logo-img{height:82px;width:auto;object-fit:contain;border-radius:8px;}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.user-selector{display:flex;gap:5px;}
.user-btn{padding:5px 11px;border-radius:20px;border:1.5px solid rgba(46,107,99,0.3);background:transparent;color:#2E6B63;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Nunito',sans-serif;}
.user-btn.active-cat{border-color:var(--terra);color:#fff;background:var(--terra);}
.user-btn.active-ali{border-color:var(--teal);color:#fff;background:var(--teal);}
.user-btn.active-tod{border-color:var(--brown);color:#fff;background:var(--brown);}
.btn-logout{padding:4px 10px;border-radius:14px;border:1.5px solid rgba(185,74,44,0.3);background:transparent;color:var(--red);font-size:9px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.btn-logout:hover{background:rgba(185,74,44,0.08);}
.tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);position:sticky;top:102px;z-index:99;}
.tab-btn{flex:1;padding:11px 6px;background:none;border:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;font-family:'Nunito',sans-serif;}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:800;}
.main{padding:14px;}
.status-bar{display:flex;align-items:center;margin-bottom:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:10px;font-weight:700;color:var(--text2);}
.status-dot{width:7px;height:7px;border-radius:50%;background:#4DB8A4;margin-right:6px;display:inline-block;flex-shrink:0;}
.status-dot.saving{background:#C8D96A;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.total-card{background:linear-gradient(135deg,#C4858A,#A8636A);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(168,99,106,0.3);}
.total-label{font-size:10px;font-weight:800;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:1.2px;}
.total-value{font-family:'Nunito',sans-serif;font-size:26px;font-weight:800;color:#ffffff;margin-top:4px;}
.total-badge{background:rgba(255,235,230,0.3);border:1px solid rgba(255,210,205,0.6);border-radius:10px;padding:5px 11px;font-size:10px;color:#FFE8E5;font-weight:700;text-align:center;line-height:1.5;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.chart-title{font-size:13px;font-weight:800;color:var(--teal);margin-bottom:10px;}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.filter-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:68px;}
.filter-group label{font-size:9px;color:var(--text2);font-weight:800;text-transform:uppercase;letter-spacing:0.5px;}
.filter-group select{background:#fff;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:10px;padding:5px 6px;appearance:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;}
canvas{max-height:190px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:16px;}
.section-title{font-size:14px;font-weight:800;color:var(--text);}
.btn-add{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:11px;font-weight:700;cursor:pointer;transition:opacity 0.2s,transform 0.15s;box-shadow:0 2px 10px rgba(46,107,99,0.35);font-family:'Nunito',sans-serif;}
.btn-add:hover{opacity:0.88;transform:translateY(-1px);}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}
table{width:100%;border-collapse:collapse;background:var(--surface);}
thead tr{background:var(--surface2);}
thead th{padding:9px 7px;font-size:8px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;border-bottom:2px solid var(--border);border-right:1px solid var(--border);text-align:center;white-space:nowrap;font-family:'Nunito',sans-serif;}
thead th:last-child{border-right:none;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
tbody td{padding:9px 7px;border-right:1px solid var(--border);text-align:center;font-family:'Nunito',sans-serif;font-size:10px;color:var(--text);font-weight:600;}
tbody td:first-child,tbody td:nth-child(2){text-align:left;font-weight:700;}
tbody td:last-child{border-right:none;}
.tag-cat{display:inline-block;padding:2px 6px;border-radius:6px;background:rgba(201,123,90,0.15);color:var(--terra);font-size:8px;font-weight:800;}
.tag-ali{display:inline-block;padding:2px 6px;border-radius:6px;background:rgba(46,107,99,0.15);color:var(--teal);font-size:8px;font-weight:800;}
.btn-row-edit,.btn-row-del{padding:3px 7px;border-radius:5px;border:1px solid var(--border);background:transparent;font-size:8px;cursor:pointer;transition:all 0.2s;white-space:nowrap;font-family:'Nunito',sans-serif;font-weight:700;}
.btn-row-edit{color:var(--teal);border-color:rgba(46,107,99,0.3);margin-right:2px;}
.btn-row-edit:hover{background:rgba(46,107,99,0.1);}
.btn-row-del{color:var(--red);border-color:rgba(185,74,44,0.25);}
.btn-row-del:hover{background:rgba(185,74,44,0.1);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,40,36,0.65);backdrop-filter:blur(4px);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 16px 44px;animation:slideUp 0.3s cubic-bezier(.22,.68,0,1.2);border-top:3px solid var(--mint);}
@keyframes slideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:800;color:var(--teal);margin-bottom:16px;text-align:center;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:9px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;}
.form-group input,.form-group select{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;padding:9px 12px;transition:border-color 0.2s;font-family:'Nunito',sans-serif;font-weight:600;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--mint);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-hint{font-size:9px;color:var(--brown);margin-top:3px;font-style:italic;font-weight:600;}
.btn-submit{width:100%;padding:13px;background:linear-gradient(135deg,#2E6B63,#1e5a54);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px;transition:opacity 0.2s;box-shadow:0 4px 14px rgba(46,107,99,0.35);font-family:'Nunito',sans-serif;}
.btn-submit:hover{opacity:0.9;}
.btn-cancel{width:100%;padding:10px;background:transparent;border:1.5px solid var(--border);border-radius:10px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;font-family:'Nunito',sans-serif;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2);}
.empty-text{font-size:12px;font-weight:600;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:#2E6B63;color:#EDD9BE;padding:10px 22px;border-radius:20px;font-size:12px;font-weight:700;z-index:300;transition:transform 0.3s cubic-bezier(.22,.68,0,1.2);white-space:nowrap;box-shadow:0 4px 14px rgba(46,107,99,0.4);font-family:'Nunito',sans-serif;}
.toast.show{transform:translateX(-50%) translateY(0);}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(20,40,36,0.65);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--surface);border-radius:18px;padding:24px 20px;max-width:300px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(20,40,36,0.25);border-top:3px solid var(--terra);}
.confirm-msg{font-size:14px;color:var(--text);margin-bottom:18px;font-weight:700;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns button{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.confirm-yes{background:var(--red);color:#fff;border:none;}
.confirm-yes:hover{opacity:0.85;}
.confirm-no{background:transparent;border:1.5px solid var(--border);color:var(--text2);}
.confirm-no:hover{background:var(--surface2);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>

  if(!r.ok) throw new Error(data.error_description || data.msg || 'Erro ao entrar');
  return data;
}

let chartBar=null, chartPie=null, chartAcBar=null, chartAcPie=null;

// DB
async function loadDB() {
  setStatus('saving');
  try {
    const token = session.access_token;
    const contas = await sbGet('/rest/v1/contas?select=*&order=ano,mes', token);
    const acoes  = await sbGet('/rest/v1/acoes?select=*&order=ano,mes', token);
    db.contas.Catarina = contas.filter(r=>r.utilizador==='Catarina').map(dbRowToContas);
    db.contas.Alice    = contas.filter(r=>r.utilizador==='Alice').map(dbRowToContas);
    db.acoes.Catarina  = acoes.map(dbRowToAcao);
  } catch(e) { console.error('loadDB:', e); }
  setStatus('saved');
}

function dbRowToContas(r) {
  return {
    id:r.id, ano:r.ano, mes:r.mes,
    cc:+r.cc||0, cp:+r.cp||0, ca:+r.ca||0, tp:+r.tp||0,
    ta:+r.ta||0, _ta_raw:+r.ta_raw||0,
    dg:+r.dg||0, _dg_raw:+r.dg_raw||0,
    rf:+r.rf||0, _rf_raw:+r.rf_raw||0,
    ra:+r.ra||0, _ra_raw:+r.ra_raw||0,
    total:+r.total||0
  };
}
function dbRowToAcao(r) {
  return {id:r.id, ano:r.ano, mes:r.mes, acao:r.acao, valor:+r.valor||0, valor_imp:+r.valor_imp||0};
}

async function upsertContas(rec, utilizador) {
  setStatus('saving');

    await sbUpsert('/rest/v1/contas', {
      id:rec.id, user_id:session.user.id, utilizador,
      ano:rec.ano, mes:rec.mes,
      cc:rec.cc, cp:rec.cp, ca:rec.ca, tp:rec.tp,
      ta:rec.ta, ta_raw:rec._ta_raw,
      dg:rec.dg, dg_raw:rec._dg_raw,
      rf:rec.rf, rf_raw:rec._rf_raw,
      ra:rec.ra, ra_raw:rec._ra_raw,
      total:rec.total

}

// UI HELPERS
function setStatus(s) {
  const dot=document.getElementById('status-dot');
  const txt=document.getElementById('status-txt');
  if(!dot||!txt) return;
  dot.className='status-dot'+(s==='saving'?' saving':'');
  txt.textContent=s==='saving'?'A guardar...':'Dados guardados';
}
function showConfirm(msg) {
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    document.getElementById('confirm-msg').textContent=msg;
    document.getElementById('confirm-overlay').classList.add('open');
  });
}
function confirmResolve(r) {
  document.getElementById('confirm-overlay').classList.remove('open');
  if(_confirmResolve){_confirmResolve(r);_confirmResolve=null;}
}
function fmt(v) {
  if(!v&&v!==0) return '—';
  return new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)+' €';
}
function tax(v)  { return parseFloat((parseFloat(v||0)*0.72).toFixed(2)); }
function half(v) { return parseFloat((parseFloat(v||0)/2).toFixed(2)); }
function showToast(m) {
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  editingId=null; editingAcaoId=null;
}

function showAuthScreen() {
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app-screen').classList.remove('visible');
}
function showAppScreen() {
  document.getElementById('auth-screen').style.display='none';

async function handleLogin() {
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  const btn=document.getElementById('login-btn');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='Preenche todos os campos';return;}
  btn.disabled=true; btn.textContent='A entrar...';
  try {
    const data=await signIn(email,password);
    saveSession(data);
    showAppScreen();
    await loadDB();
    render();
  } catch(e) { errEl.textContent=e.message; }
  finally { btn.disabled=false; btn.textContent='Entrar'; }
}

// DATA
function getContasRows(user) {
  if(user==='Todos') {
    const all=[];
    ['Catarina','Alice'].forEach(u=>(db.contas[u]||[]).forEach(r=>all.push({...r,_user:u})));
    return all.map(r=>({...r,total:(r.cc||0)+(r.cp||0)+(r.ca||0)+(r.tp||0)+(r.ta||0)+(r.dg||0)+(r.rf||0)+(r.ra||0)}));
  }
  return (db.contas[user]||[]).map(r=>({...r,total:(r.cc||0)+(r.cp||0)+(r.ca||0)+(r.tp||0)+(r.ta||0)+(r.dg||0)+(r.rf||0)+(r.ra||0)}));
}
function getContasAgg(user) {
  if(user==='Todos') {
    const map={};
    ['Catarina','Alice'].forEach(u=>(db.contas[u]||[]).forEach(r=>{
      const k=r.ano+'_'+r.mes;
      if(!map[k]) map[k]={ano:r.ano,mes:r.mes,cc:0,cp:0,ca:0,tp:0,ta:0,dg:0,rf:0,ra:0};
      ['cc','cp','ca','tp','ta','dg','rf','ra'].forEach(f=>map[k][f]+=(r[f]||0));
    }));
    return Object.values(map).map(r=>({...r,total:['cc','cp','ca','tp','ta','dg','rf','ra'].reduce((s,f)=>s+r[f],0)}));
  }
  return getContasRows(user);
}
function applyFilters(arr,ai,af,mi,mf) {
  return arr.filter(r=>{
    const a=parseInt(r.ano),m=MONTHS.indexOf(r.mes);
    if(ai&&a<parseInt(ai)) return false;
    if(af&&a>parseInt(af)) return false;
    if(mi&&m<MONTHS.indexOf(mi)) return false;
    if(mf&&m>MONTHS.indexOf(mf)) return false;
    return true;
  });
}
function sortByPeriod(arr) { return arr.sort((a,b)=>a.ano!==b.ano?a.ano.localeCompare(b.ano):MONTHS.indexOf(a.mes)-MONTHS.indexOf(b.mes)); }
function anosOpts(sel) { return '<option value="">Todos</option>'+ANOS.map(a=>'<option value="'+a+'"'+(a==sel?' selected':'')+'>'+a+'</option>').join(''); }
function mesOpts(sel)  { return '<option value="">Todos</option>'+MONTHS.map(m=>'<option value="'+m+'"'+(m==sel?' selected':'')+'>'+m+'</option>').join(''); }
function render() { if(currentTab==='contas') renderContas(); else renderAcoes(); }

function onFilterChange(prefix) {
  const ai=document.getElementById(prefix+'-ai')?.value||'';
  const af=document.getElementById(prefix+'-af')?.value||'';
  const mi=document.getElementById(prefix+'-mi')?.value||'';
  const mf=document.getElementById(prefix+'-mf')?.value||'';
  filterState[prefix+'_ai']=ai; filterState[prefix+'_af']=af;
  filterState[prefix+'_mi']=mi; filterState[prefix+'_mf']=mf;
  if(prefix==='c') { const fl=applyFilters(sortByPeriod(getContasAgg(currentUser)),ai,af,mi,mf); renderBarChart(fl); renderPieChart(fl); }
  else { const fl=applyFilters(sortByPeriod([...getAcoesData()]),ai,af,mi,mf); renderAcaoBarChart(fl); renderAcaoPieChart(fl); }
}

  const rows=sortByPeriod(getContasRows(currentUser));

  const last=agg.length?agg[agg.length-1]:null;
  const ro=currentUser==='Todos';
  const f=filterState;
  document.getElementById('main-content').innerHTML=`
    <div class="status-bar"><span class="status-dot" id="status-dot"></span><span id="status-txt">Dados guardados</span></div>
    <div class="total-card">
      <div><div class="total-label">Total Atual</div><div class="total-value">${last?fmt(last.total):'—'}</div></div>
      <div class="total-badge">${last?last.mes+' '+last.ano:'Sem dados'}</div>
    </div>
    <div class="chart-card"><div class="chart-title">Evolução Total</div>
      <div class="filter-row">
        <div class="filter-group"><label>Ano início</label><select id="c-ai" onchange="onFilterChange('c')">${anosOpts(f.c_ai)}</select></div>
        <div class="filter-group"><label>Ano fim</label><select id="c-af" onchange="onFilterChange('c')">${anosOpts(f.c_af)}</select></div>
        <div class="filter-group"><label>Mês início</label><select id="c-mi" onchange="onFilterChange('c')">${mesOpts(f.c_mi)}</select></div>
        <div class="filter-group"><label>Mês fim</label><select id="c-mf" onchange="onFilterChange('c')">${mesOpts(f.c_mf)}</select></div>
      </div><canvas id="chart-bar"></canvas></div>

    <div class="section-header">
      <div class="section-title">Registos (${rows.length})</div>
      ${!ro?'<button class="btn-add" onclick="openModalContas()">Novo Registo</button>':''}
    </div>
    <div class="tbl-wrap" id="tbl-c">${!rows.length?'<div class="empty-state"><div class="empty-text">Sem registos.</div></div>':''}</div>`;
  const fl=applyFilters(agg,f.c_ai,f.c_af,f.c_mi,f.c_mf);
  renderBarChart(fl); renderPieChart(fl); renderContasTable(rows,ro);
}

function renderContasTable(rows,ro) {
  const el=document.getElementById('tbl-c'); if(!el||!rows.length) return;
  const showU=currentUser==='Todos';
  el.innerHTML='<table><thead><tr>'+(showU?'<th>Utilizador</th>':'')+'<th>Ano</th><th>Mês</th><th>C.Corrente</th><th>Poupança</th><th>C.Aforro</th><th>T.Poup.</th><th>T.Ações</th><th>Degiro</th><th>R.Férias</th><th>R.Ações</th><th>Total</th>'+(ro?'':'<th>Ações</th>')+'</tr></thead><tbody>'+
    [...rows].reverse().map(r=>'<tr>'+(showU?'<td><span class="tag-'+(r._user==='Catarina'?'cat':'ali')+'">'+(r._user==='Catarina'?'Catarina':'Alice')+'</span></td>':'')+'<td>'+r.ano+'</td><td>'+r.mes+'</td><td>'+fmt(r.cc)+'</td><td>'+fmt(r.cp)+'</td><td>'+fmt(r.ca)+'</td><td>'+fmt(r.tp)+'</td><td>'+fmt(r.ta)+'</td><td>'+fmt(r.dg)+'</td><td>'+fmt(r.rf)+'</td><td>'+fmt(r.ra)+'</td><td style="color:var(--teal);font-weight:800">'+fmt(r.total)+'</td>'+(ro?'':'<td><button class="btn-row-edit" onclick="editContas(''+r.id+'')">Editar</button> <button class="btn-row-del" onclick="deleteContas(''+r.id+'')">Apagar</button></td>')+'</tr>').join('')+'</tbody></table>';
}

function renderBarChart(data) {
  const ctx=document.getElementById('chart-bar'); if(!ctx) return;
  if(chartBar){chartBar.destroy();chartBar=null;}
  if(!data.length) return;
  const clr=currentUser==='Catarina'?'rgba(196,133,138,0.85)':currentUser==='Alice'?'rgba(46,107,99,0.85)':'rgba(168,132,92,0.85)';
  chartBar=new Chart(ctx,{type:'bar',data:{labels:data.map(r=>r.mes.substring(0,3)+' '+r.ano),datasets:[{label:'Total',data:data.map(r=>r.total),backgroundColor:clr,borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#4a7068',font:{size:8,family:'Nunito'}},grid:{color:'#c5d4d0'}},y:{ticks:{color:'#4a7068',font:{size:8,family:'Nunito'},callback:v=>'€'+Number(v).toLocaleString('pt-PT')},grid:{color:'#c5d4d0'}}}}});
}
function renderPieChart(data) {
  const ctx=document.getElementById('chart-pie'); if(!ctx) return;
  if(chartPie){chartPie.destroy();chartPie=null;}
  if(!data.length) return;
  const s={cc:0,cp:0,ca:0,tp:0,ta:0,dg:0,rf:0,ra:0};
  data.forEach(r=>['cc','cp','ca','tp','ta','dg','rf','ra'].forEach(k=>s[k]+=(r[k]||0)));
  const lbls=['C.Corrente','Poupança','C.Aforro','T.Poupança','T.Ações','Degiro','R.Férias','R.Ações'];
  const vals=[s.cc,s.cp,s.ca,s.tp,s.ta,s.dg,s.rf,s.ra];
  const cols=['#C97B5A','#2E6B63','#A8845C','#4DB8A4','#C8D96A','#8B5E3C','#5BA8A0','#E8A87C'];
  const items=lbls.map((l,i)=>({l,v:vals[i],c:cols[i]})).filter(x=>x.v>0);
  chartPie=new Chart(ctx,{type:'doughnut',data:{labels:items.map(x=>x.l),datasets:[{data:items.map(x=>x.v),backgroundColor:items.map(x=>x.c),borderWidth:3,borderColor:'#FDFAF5'}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#4a7068',font:{size:9,family:'Nunito'},padding:8}},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}}}});
}

// CONTAS CRUD
function openModalContas(id) {
  editingId=id||null;
  document.getElementById('mc-title').textContent=id?'Editar Registo':'Novo Registo';
  if(id) {
    const r=(db.contas[currentUser]||[]).find(x=>x.id===id);
    if(r) {
      document.getElementById('f-ano').value=r.ano; document.getElementById('f-mes').value=r.mes;
      document.getElementById('f-cc').value=r.cc||''; document.getElementById('f-cp').value=r.cp||'';
      document.getElementById('f-ca').value=r.ca||''; document.getElementById('f-tp').value=r.tp||'';
      document.getElementById('f-ta').value=r._ta_raw||r.ta||''; document.getElementById('f-dg').value=r._dg_raw||r.dg||'';
      document.getElementById('f-rf').value=r._rf_raw||r.rf||''; document.getElementById('f-ra').value=r._ra_raw||r.ra||'';
    }
  } else {
    ['f-cc','f-cp','f-ca','f-tp','f-ta','f-dg','f-rf','f-ra'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-ano').value=''; document.getElementById('f-mes').value='';
  }
  document.getElementById('modal-contas').classList.add('open');
}
function editContas(id) { openModalContas(id); }
async function saveContas() {
  const ano=document.getElementById('f-ano').value, mes=document.getElementById('f-mes').value;
  if(!ano||!mes) { showToast('Ano e Mês são obrigatórios'); return; }
  const v=i=>parseFloat(document.getElementById(i).value||0)||0;
  const ta_r=v('f-ta'),dg_r=v('f-dg'),rf_r=v('f-rf'),ra_r=v('f-ra');
  const rec={
    id:editingId||Date.now().toString(), ano, mes,
    cc:v('f-cc'),cp:v('f-cp'),ca:v('f-ca'),tp:v('f-tp'),
    ta:tax(ta_r),_ta_raw:ta_r, dg:tax(dg_r),_dg_raw:dg_r,
    rf:half(rf_r),_rf_raw:rf_r, ra:tax(ra_r),_ra_raw:ra_r
  };
  rec.total=rec.cc+rec.cp+rec.ca+rec.tp+rec.ta+rec.dg+rec.rf+rec.ra;
  if(!db.contas[currentUser]) db.contas[currentUser]=[];
  if(editingId) { const i=db.contas[currentUser].findIndex(x=>x.id===editingId); if(i>=0) db.contas[currentUser][i]=rec; }
  else db.contas[currentUser].push(rec);
  closeModal('modal-contas');
  await upsertContas(rec, currentUser);
  showToast(editingId?'Registo atualizado':'Registo adicionado');
  render();
}
async function deleteContas(id) {
  const ok=await showConfirm('Apagar este registo?'); if(!ok) return;
  db.contas[currentUser]=(db.contas[currentUser]||[]).filter(r=>r.id!==id);
  await deleteContasDB(id);
  showToast('Apagado'); render();
}

  chartAcBar=new Chart(ctx,{type:'bar',data:{labels:Object.keys(map),datasets:[{label:'Total',data:Object.values(map),backgroundColor:'rgba(196,133,138,0.85)',borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#4a7068',font:{size:8,family:'Nunito'}},grid:{color:'#c5d4d0'}},y:{ticks:{color:'#4a7068',font:{size:8,family:'Nunito'}},grid:{color:'#c5d4d0'}}}}});
}
function renderAcaoPieChart(data) {
  const ctx=document.getElementById('chart-ac-pie'); if(!ctx) return;
  if(chartAcPie){chartAcPie.destroy();chartAcPie=null;}
  if(!data.length) return;
  const map={};data.forEach(r=>{map[r.acao]=(map[r.acao]||0)+(r.valor||0);});
  const cols=['#C97B5A','#2E6B63','#A8845C','#4DB8A4','#C8D96A','#8B5E3C','#E8A87C','#5BA8A0','#B94A2C','#6DAA7A'];
  chartAcPie=new Chart(ctx,{type:'doughnut',data:{labels:Object.keys(map),datasets:[{data:Object.values(map),backgroundColor:cols.slice(0,Object.keys(map).length),borderWidth:3,borderColor:'#FDFAF5'}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#4a7068',font:{size:9,family:'Nunito'},padding:8}},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}}}});
}
function openModalAcoes(id) {
  editingAcaoId=id||null;
  document.getElementById('ma-title').textContent=id?'Editar Ação':'Nova Ação';
  if(id) {
    const r=(db.acoes.Catarina||[]).find(x=>x.id===id);
    if(r) { document.getElementById('fa-ano').value=r.ano; document.getElementById('fa-mes').value=r.mes; document.getElementById('fa-acao').value=r.acao; document.getElementById('fa-valor').value=r.valor; }
  } else {
    ['fa-ano','fa-mes','fa-acao'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('fa-valor').value='';
  }
  document.getElementById('modal-acoes').classList.add('open');
}
function editAcao(id) { openModalAcoes(id); }
async function saveAcoes() {
  const ano=document.getElementById('fa-ano').value, mes=document.getElementById('fa-mes').value;
  const acao=document.getElementById('fa-acao').value;
  const valor=parseFloat(document.getElementById('fa-valor').value||0)||0;
  if(!ano||!mes||!acao) { showToast('Preenche todos os campos'); return; }
  const rec={id:editingAcaoId||Date.now().toString(),ano,mes,acao,valor,valor_imp:tax(valor)};
  if(!db.acoes.Catarina) db.acoes.Catarina=[];
  if(editingAcaoId) { const i=db.acoes.Catarina.findIndex(x=>x.id===editingAcaoId); if(i>=0) db.acoes.Catarina[i]=rec; }
  else db.acoes.Catarina.push(rec);
  closeModal('modal-acoes');
  await upsertAcao(rec);
  showToast(editingAcaoId?'Ação atualizada':'Ação adicionada');
  render();
}
async function deleteAcao(id) {
  const ok=await showConfirm('Apagar esta ação?'); if(!ok) return;
  db.acoes.Catarina=(db.acoes.Catarina||[]).filter(r=>r.id!==id);
  await deleteAcaoDB(id);
  showToast('Apagado'); render();
}

document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o){o.classList.remove('open');editingId=null;editingAcaoId=null;} });
});

async function init() {
  if(loadSession()) {
    showAppScreen();
    await loadDB();
    render();
  } else {
    showAuthScreen();
  }
}
init();
</script>
</body>
</html>
